version: "3.8"

services:
  api-gateway:
    build: .
    image: api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      EXTERNAL_USER_SERVICE_URL: ${EXTERNAL_USER_SERVICE_URL}
      EXTERNAL_AUTH_SERVICE_URL: ${EXTERNAL_AUTH_SERVICE_URL}
    ports:
      - "8083:8080"
    depends_on:
      - auth-service
      - user-service
      - order-service

  postgres-user-service:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB_USER_SERVICE}
      POSTGRES_USER: ${POSTGRES_USER_USER_SERVICE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_USER_SERVICE}
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--bind", "0.0.0.0" ]
    ports:
      - "6379:6379"

  user-service:
    build: ../UserService
    image: user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL_USER_SERVICE}
      DB_USERNAME: ${DB_USERNAME_USER_SERVICE}
      DB_PASSWORD: ${DB_PASSWORD_USER_SERVICE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - postgres-user-service
      - redis

  postgres-auth-service:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB_AUTH_SERVICE}
      POSTGRES_USER: ${POSTGRES_USER_AUTH_SERVICE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AUTH_SERVICE}
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  auth-service:
    build: ../AuthService
    image: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL_AUTH_SERVICE}
      DB_USERNAME: ${DB_USERNAME_AUTH_SERVICE}
      DB_PASSWORD: ${DB_PASSWORD_AUTH_SERVICE}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8080"
    depends_on:
      - postgres-auth-service

  postgres-order-service:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB_ORDER_SERVICE}
      POSTGRES_USER: ${POSTGRES_USER_ORDER_SERVICE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ORDER_SERVICE}
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data

  order-service:
    build: ../OrderService
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: ${DB_URL_ORDER_SERVICE}
      DB_USERNAME: ${DB_USERNAME_ORDER_SERVICE}
      DB_PASSWORD: ${DB_PASSWORD_ORDER_SERVICE}
      JWT_SECRET: ${JWT_SECRET}
      EXTERNAL_USER_SERVICE_URL: ${EXTERNAL_USER_SERVICE_URL}
    ports:
      - "8082:8080"
    depends_on:
      - postgres-order-service

volumes:
  postgres_user_data:
  postgres_auth_data:
  postgres_order_data: